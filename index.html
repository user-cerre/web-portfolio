<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Portfolio</title>
	<link rel="icon" type="image/svg+xml" href="favicon.jpg">
	<link rel="stylesheet" href="src/css/style.css">
	<link rel="stylesheet" href="src/css/animations.css">
</head>
<body>
	<header>
    <a href="#about-me" class="logo-link" aria-label="Go to top">
        <img src="favicon.jpg" alt="Cerre Logo" class="header-logo">
    </a>
    <nav>
        <a href="#about-me">About me</a>
        <a href="#activity">GitHub Activity</a>
        <a href="#portfolio">Portfolio</a>
    </nav>
    <button type="button" id="theme-toggle" aria-label="Toggle theme">🌙</button>
</header>

	<main>
		<section id="about-me">
    		<h1>My Portfolio</h1>
    		<div class="about-grid">
        		<div id="profile-container">
         			<p>Loading GitHub profile...</p>
       			</div>
        		<div id="readme-container" class="readme-card">
            		<p>Loading profile README...</p>
        		</div>
    		</div>
		</section>
		<section id="activity">
    		<h2>GitHub Activity</h2>
    		<img src="https://ghchart.rshah.org/2563eb/user-cerre" alt="GitHub Contribution Chart">
		</section>
		<section id="portfolio">
			<h2>Portfolio</h2>
			<div id="filter-container">
				<button type="button" data-lang="all">All</button>
                <button type="button" data-lang="JavaScript">JavaScript</button>
                <button type="button" data-lang="HTML">HTML</button>
                <button type="button" data-lang="Java">Java</button>
				<button type="button" data-lang="C++">C++</button>
				<button type="button" data-lang="Kotlin">Kotlin</button>
				<button type="button" data-lang="CSS">CSS</button>
			</div>
			<div id="repo-container" class="repo-container"></div>
		</section>
	</main>

	<footer>
		<p>&copy; 2026 Web Portfolio</p>
	</footer>

	<script type="module" src="src/js/app.js"></script>
</body>
</html>
